<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Intelligence Dashboard</title>
    <!--
      All scripts are local extension files only.
      CDN scripts removed — violate Manifest V3 CSP (script-src 'self').
      React + Recharts are bundled inside dist/bundle.js via webpack.
    -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(99,102,241,0.15), transparent 30%),
          linear-gradient(180deg, #0f172a 0%, #020617 100%);
        font-family: Inter, system-ui, sans-serif;
        color: #f8fafc;
      }
      #root { width: 100%; min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      1. GDPR Assistant must load BEFORE the React bundle so that
         window.GDPRAssistant is available when usePrivacyData initializes.
    -->
    <script src="../scripts/gdpr-assistant.js"></script>

    <!--
      2. React bundle (includes React 18, ReactDOM, Recharts, all components).
         Build with: npm run build
    -->
    <script src="dist/bundle.js"></script>
  </body>
</html>
